<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>みさフェス 遠隔承認(実験的機能)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Yomogi&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Kosugi&display=swap" rel="stylesheet">
<style>
  :root{
    --night: #1a1420;
    --gold: #d4a843;
    --lantern: #e05a2d;
    --paper: #f5ece0;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--night);
    color:var(--paper);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    padding:16px 14px 60px;
  }
  h1{
    font-size:16px;
    color:var(--gold);
    text-align:center;
    margin:8px 0 4px;
  }
  .sub{
    font-size:11.5px;
    color:rgba(245,236,224,0.55);
    text-align:center;
    line-height:1.7;
    margin-bottom:18px;
  }
  .warn-box{
    background:rgba(224,90,45,0.12);
    border:1.5px solid rgba(224,90,45,0.5);
    border-radius:10px;
    padding:12px 14px;
    font-size:11.5px;
    line-height:1.7;
    margin-bottom:18px;
    color:rgba(245,236,224,0.9);
  }
  #refresh-btn{
    display:block;
    width:100%;
    padding:12px;
    margin-bottom:16px;
    background:rgba(212,168,67,0.12);
    border:1.5px solid var(--gold);
    color:var(--gold);
    border-radius:10px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
  }
  .item{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(212,168,67,0.25);
    border-radius:12px;
    padding:14px;
    margin-bottom:14px;
    transition:opacity 0.3s ease;
  }
  .preview-stage{
    position:relative;
    width:100%;
    border-radius:8px;
    overflow:hidden;
    margin-bottom:10px;
    background:#000;
  }
  .preview-stage-textonly{
    aspect-ratio:16/10;
    background:linear-gradient(135deg, #1a1420, #2a2036);
  }
  .preview-stage img{
    width:100%;
    display:block;
    margin-bottom:0;
  }
  .preview-caption{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    padding:16px;
    pointer-events:none;
  }
  .preview-caption-text{
    padding:8px 14px;
    font-size:15px;
    font-weight:700;
    line-height:1.5;
    max-width:90%;
    word-break:break-word;
    text-align:center;
  }
  .item .msg{
    font-size:13px;
    line-height:1.6;
    margin-bottom:6px;
    white-space:pre-wrap;
  }
  .item .time{
    font-size:10.5px;
    color:rgba(245,236,224,0.4);
    margin-bottom:10px;
  }
  .item .flag{
    font-size:11px;
    color:#ff9a7a;
    background:rgba(224,45,45,0.15);
    border-radius:6px;
    padding:6px 8px;
    margin-bottom:10px;
  }
  .approve-btn{
    display:block;
    width:100%;
    padding:12px;
    background:linear-gradient(135deg, rgba(212,168,67,0.3), rgba(224,90,45,0.25));
    border:1.5px solid var(--gold);
    color:var(--gold);
    border-radius:8px;
    font-size:13.5px;
    font-weight:900;
    cursor:pointer;
  }
  .approve-btn:disabled{
    opacity:0.4;
    cursor:default;
  }
  .approve-btn.done{
    background:rgba(120,180,120,0.2);
    border-color:#7fd97f;
    color:#7fd97f;
  }
  .empty{
    text-align:center;
    color:rgba(245,236,224,0.4);
    font-size:12.5px;
    padding:40px 0;
  }
  .style-picker{
    margin:10px 0;
    padding:10px;
    background:rgba(255,255,255,0.03);
    border-radius:8px;
  }
  .style-picker-row{
    margin-bottom:8px;
  }
  .style-picker-row label{
    display:block;
    font-size:10.5px;
    color:rgba(245,236,224,0.5);
    margin-bottom:5px;
  }
  .style-opt-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .color-opt{
    width:26px; height:26px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.3);
    cursor:pointer;
  }
  .color-opt.selected{
    border-color:var(--gold);
    box-shadow:0 0 0 2px rgba(212,168,67,0.4);
  }
  .text-opt{
    padding:6px 10px;
    background:rgba(255,255,255,0.06);
    border:1.5px solid rgba(255,255,255,0.15);
    border-radius:6px;
    font-size:11px;
    color:var(--paper);
    cursor:pointer;
  }
  .text-opt.selected{
    border-color:var(--gold);
    background:rgba(212,168,67,0.2);
    color:var(--gold);
  }
</style>
</head>
<body>

<h1>📋 遠隔承認(実験的機能)</h1>
<div class="sub">パソコンを使わなくても、この画面から会場スクリーンに写真を追加できます。</div>

<div class="warn-box">
  ⚠️ これは実験的な機能です。反映まで少し時間がかかることがあります(会場側が数秒おきに確認しています)。うまくいかない場合は、これまで通りパソコンの操作パネルから承認してください。
</div>

<button id="refresh-btn">🔄 一覧を更新する</button>

<div id="item-list"></div>

<script>
  const PENDING_URL = "https://script.google.com/macros/s/AKfycbzu8iWmrG1pRTN1JBiDFLdvfIDtckPsrRD2fT6vkNHunHJi2Nexo_KIvjveO5r7xP_ixw/exec?action=getPending";
  const APPROVALS_URL = "https://script.google.com/macros/s/AKfycbzu8iWmrG1pRTN1JBiDFLdvfIDtckPsrRD2fT6vkNHunHJi2Nexo_KIvjveO5r7xP_ixw/exec?action=getRemoteApprovals";
  const SUBMIT_URL = "https://script.google.com/macros/s/AKfycbzu8iWmrG1pRTN1JBiDFLdvfIDtckPsrRD2fT6vkNHunHJi2Nexo_KIvjveO5r7xP_ixw/exec";

  const itemList = document.getElementById('item-list');

  // 簡易的なNGワードチェック(操作パネル側と同じ考え方の、簡易版)
  const NG_WORDS = ['死ね','殺す','馬鹿','ばか','アホ','あほ','クソ','くそ','キモい','きもい'];
  function checkNgWords(message){
    if(!message) return [];
    return NG_WORDS.filter(w => message.includes(w));
  }

  // 装飾の選択肢(操作パネル側の主要な項目だけを、簡易的に再現したもの)
  const COLOR_OPTS = ['#2a2118','#ffffff','#e05a2d','#d4a843','#4caf6e','#3c8ce8','#a24dff','#ff4dd2','#ff4d4d','#1a1420'];
  const BG_OPTS = ['#f5ece0','#1a1420','#e05a2d','#2a4d3a','#1a2a4d','#4a1a4d','#8a5a12','#c9401f'];
  const SHAPE_OPTS = [{v:'glow', t:'ぼかし'}, {v:'box', t:'四角'}, {v:'bubble', t:'吹き出し'}];
  const FONT_OPTS = [{v:'yomogi', t:'手書き風'}, {v:'klee', t:'やわらかい手書き'}, {v:'textbook', t:'教科書体'}, {v:'gothic', t:'ゴシック体'}];
  const SIZE_OPTS = [{v:18, t:'小'}, {v:26, t:'中'}, {v:36, t:'大'}, {v:48, t:'特大'}];
  const DECO_OPTS = [{v:'normal', t:'通常'}, {v:'shadow', t:'ドロップシャドウ'}, {v:'gradient', t:'グラデーション'}, {v:'pop', t:'ポップ'}, {v:'rainbow', t:'虹色'}, {v:'outline', t:'袋文字'}];
  const POS_OPTS = [{v:'top', t:'上'}, {v:'center', t:'中央'}, {v:'bottom', t:'下'}];
  const FONT_CSS = {
    gothic: '"Zen Kaku Gothic New", sans-serif',
    yomogi: '"Yomogi", cursive',
    klee: '"Klee One", cursive',
    textbook: '"Kosugi", sans-serif' // 本来の教科書体はWindows内蔵フォントでスマホでは使えないため、雰囲気の近いフォントで代用している
  };

  let isFirstLoad = true;
  const renderedKeys = new Set(); // すでに画面に描画済みの投稿(選びかけの装飾を、毎回リセットしないため)

  async function loadPending(){
    if(isFirstLoad){
      itemList.innerHTML = '<div class="empty">読み込み中…</div>';
    }
    try{
      const [pendingRes, approvalsRes] = await Promise.all([
        fetch(PENDING_URL, { cache: 'no-store' }),
        fetch(APPROVALS_URL, { cache: 'no-store' })
      ]);
      const items = await pendingRes.json();
      const approvals = await approvalsRes.json();
      // すでに遠隔承認済みのものは、二重に追加されないよう一覧から除外する
      const approvedKeys = new Set(approvals.map(a => a.photoKey));
      const remaining = items.filter(item => !approvedKeys.has(item.time));

      if(isFirstLoad){
        renderList(remaining); // 最初だけ、一覧全体をまるごと描画する
        isFirstLoad = false;
      }else{
        // 2回目以降は、まだ画面に出ていない「新着分」だけを、そっと追加する
        // (すでに表示中の項目は、選びかけの装飾が消えないよう、一切触らない)
        const newItems = remaining.filter(item => !renderedKeys.has(item.time));
        if(newItems.length > 0) appendItems(newItems);
      }
    }catch(err){
      if(isFirstLoad){
        itemList.innerHTML = '<div class="empty">読み込みに失敗しました。もう一度「更新する」を押してください</div>';
      }
    }
  }

  function renderList(items){
    if(items.length === 0){
      itemList.innerHTML = '<div class="empty">承認待ちの投稿はありません</div>';
      return;
    }
    itemList.innerHTML = '';
    appendItems(items);
  }

  function appendItems(items){
    // 「承認待ちの投稿はありません」の表示が出ていたら、先に消しておく
    const emptyEl = itemList.querySelector('.empty');
    if(emptyEl) emptyEl.remove();

    items.forEach(item => {
      const key = item.time;
      renderedKeys.add(key);
      const el = document.createElement('div');
      el.className = 'item';
      el.dataset.key = key; // 高速チェックで、この項目を素早く探せるようにする

      const ngWords = checkNgWords(item.message);
      const isTextOnly = !item.photoUrl && !!item.message; // 写真がなく、文字のみの投稿かどうか
      let html = '';
      if(item.photoUrl){
        html += `<div class="preview-stage"><img src="${item.photoUrl}" loading="lazy"><div class="preview-caption" style="display:none;"><span class="preview-caption-text"></span></div></div>`;
      }else if(item.message){
        // 写真がない(文字のみの)投稿も、会場では暗い背景の上に表示されるため、それに合わせたプレビュー欄を用意する
        html += `<div class="preview-stage preview-stage-textonly" style="background:${BG_OPTS[0]};"><div class="preview-caption" style="display:none;"><span class="preview-caption-text"></span></div></div>`;
      }
      if(item.message){
        html += `<div class="msg">${escapeHtml(item.message)}</div>`;
      }
      html += `<div class="time">${escapeHtml(item.time)}</div>`;
      if(ngWords.length > 0){
        html += `<div class="flag">⚠️ 気になる言葉が含まれています(${escapeHtml(ngWords.join('、'))})</div>`;
      }

      // 簡易装飾選択(文字色・形・位置)。メッセージがある投稿の時だけ意味があるが、常に表示しておく
      // ※文字のみの投稿(写真なし)は、会場での表示の仕組み自体が異なり、
      //   「背景色」は画面全体の背景として使われ、「形」は使われず、「装飾効果」も「袋文字」以外は反映されない
      html += `<div class="style-picker">
        <div class="style-picker-row">
          <label>文字の大きさ</label>
          <div class="style-opt-row size-row">
            ${SIZE_OPTS.map((s,i) => `<div class="text-opt${i===1?' selected':''}" data-size="${s.v}">${s.t}</div>`).join('')}
          </div>
        </div>
        <div class="style-picker-row">
          <label>文字色</label>
          <div class="style-opt-row color-row">
            ${COLOR_OPTS.map((c,i) => `<div class="color-opt${i===0?' selected':''}" data-color="${c}" style="background:${c};"></div>`).join('')}
          </div>
        </div>
        <div class="style-picker-row">
          <label>${isTextOnly ? '画面全体の背景色' : '背景色'}</label>
          <div class="style-opt-row bg-row">
            ${BG_OPTS.map((c,i) => `<div class="color-opt${i===0?' selected':''}" data-bg="${c}" style="background:${c}; ${c==='#ffffff' ? 'box-shadow:inset 0 0 0 1px rgba(0,0,0,0.2);' : ''}"></div>`).join('')}
          </div>
        </div>
        ${isTextOnly ? '' : `<div class="style-picker-row">
          <label>形</label>
          <div class="style-opt-row shape-row">
            ${SHAPE_OPTS.map((s,i) => `<div class="text-opt${i===0?' selected':''}" data-shape="${s.v}">${s.t}</div>`).join('')}
          </div>
        </div>`}
        <div class="style-picker-row">
          <label>装飾効果${isTextOnly ? '(文字のみの投稿は「袋文字」以外は反映されません)' : ''}</label>
          <div class="style-opt-row deco-row">
            ${(isTextOnly ? DECO_OPTS.filter(d => d.v === 'normal' || d.v === 'outline') : DECO_OPTS).map((d,i) => `<div class="text-opt${i===0?' selected':''}" data-deco="${d.v}">${d.t}</div>`).join('')}
          </div>
        </div>
        <div class="style-picker-row">
          <label>フォント</label>
          <div class="style-opt-row font-row">
            ${FONT_OPTS.map((f,i) => `<div class="text-opt${i===0?' selected':''}" data-font="${f.v}">${f.t}</div>`).join('')}
          </div>
        </div>
        <div class="style-picker-row">
          <label>文字の位置</label>
          <div class="style-opt-row pos-row">
            ${POS_OPTS.map((p,i) => `<div class="text-opt${i===2?' selected':''}" data-pos="${p.v}">${p.t}</div>`).join('')}
          </div>
        </div>
      </div>`;
      html += `<button class="approve-btn">✅ 会場スクリーンに追加する</button>`;
      el.innerHTML = html;

      // 選んだ装飾を、写真の上に実際に重ねて見せる(プレビュー。会場スクリーン側のロジックにできるだけ忠実に再現している)
      function hexToRgbStr_(hex){
        const v = hex.replace('#', '');
        return `${parseInt(v.substr(0,2),16)},${parseInt(v.substr(2,2),16)},${parseInt(v.substr(4,2),16)}`;
      }
      function isLightColor_(hex){
        const v = hex.replace('#', '');
        const r = parseInt(v.substr(0,2),16), g = parseInt(v.substr(2,2),16), b = parseInt(v.substr(4,2),16);
        return (r*299 + g*587 + b*114) / 1000 > 150;
      }
      function updatePreview(){
        const previewCap = el.querySelector('.preview-caption');
        if(!previewCap || !item.message) return;
        const size = parseInt(el.querySelector('.size-row .text-opt.selected').dataset.size, 10);
        const color = el.querySelector('.color-row .color-opt.selected').dataset.color;
        const bg = el.querySelector('.bg-row .color-opt.selected').dataset.bg;
        const deco = el.querySelector('.deco-row .text-opt.selected').dataset.deco;
        const font = el.querySelector('.font-row .text-opt.selected').dataset.font;
        const pos = el.querySelector('.pos-row .text-opt.selected').dataset.pos;
        previewCap.style.display = 'flex';
        previewCap.style.alignItems = pos === 'top' ? 'flex-start' : (pos === 'bottom' ? 'flex-end' : 'center');
        const box = previewCap.querySelector('.preview-caption-text');
        box.textContent = item.message;
        box.style.fontFamily = FONT_CSS[font] || FONT_CSS.yomogi;
        box.style.color = color;
        box.style.webkitTextFillColor = '';
        box.style.webkitTextStroke = '';
        box.style.backgroundImage = 'none';
        box.style.webkitBackgroundClip = 'border-box';
        box.style.backgroundClip = 'border-box';
        box.style.textShadow = 'none';
        box.style.fontWeight = '700';
        box.style.boxShadow = 'none';

        if(isTextOnly){
          // 文字のみの投稿:背景色は「画面全体」に、文字には背景をつけない(会場側の実際の仕組みと同じ)
          const stage = el.querySelector('.preview-stage-textonly');
          if(stage) stage.style.background = bg;
          box.style.background = 'transparent';
          box.style.borderRadius = '0';
          box.style.padding = '4px';
          box.style.fontSize = (size * 0.85) + 'px'; // 文字のみの投稿は、会場でも大きめに表示される
          if(deco === 'outline'){
            box.style.webkitTextStroke = `1.3px ${isLightColor_(color) ? '#1a1420' : '#f5ece0'}`;
          }
          return;
        }

        const bgRgb = hexToRgbStr_(bg);
        const shape = el.querySelector('.shape-row .text-opt.selected').dataset.shape;
        // プレビュー欄は実物より小さいので、見た目のバランスを取って縮小して表示する(縮小率は目安)
        box.style.fontSize = (size * 0.55) + 'px';

        // 形(会場側の.shape-glow等と同じ考え方で再現する)
        if(shape === 'glow'){
          box.style.background = `radial-gradient(ellipse at center, rgba(${bgRgb},0.92) 0%, rgba(${bgRgb},0.65) 45%, rgba(${bgRgb},0) 78%)`;
          box.style.borderRadius = '0';
          box.style.padding = '14px 22px';
        }else if(shape === 'bubble'){
          box.style.background = bg;
          box.style.borderRadius = '16px';
          box.style.padding = '8px 14px';
        }else{
          box.style.background = bg;
          box.style.borderRadius = '6px';
          box.style.padding = '8px 14px';
        }

        // 装飾効果(会場側のdeco-outline等と同じ考え方で再現する)
        if(deco === 'outline'){
          box.style.webkitTextStroke = `1.3px ${isLightColor_(color) ? '#1a1420' : '#f5ece0'}`;
        }else if(deco === 'shadow'){
          const d = Math.max(2, Math.round(size / 10));
          box.style.textShadow = `${d}px ${d}px 0 rgba(0,0,0,0.55)`;
        }else if(deco === 'gradient'){
          box.style.backgroundImage = `linear-gradient(135deg, ${color}, #d4a843)`;
          box.style.webkitBackgroundClip = 'text';
          box.style.backgroundClip = 'text';
          box.style.webkitTextFillColor = 'transparent';
        }else if(deco === 'rainbow'){
          box.style.backgroundImage = 'linear-gradient(90deg, #ff4d4d, #ffb14d, #ffe14d, #4dff88, #4dc9ff, #a24dff, #ff4dd2)';
          box.style.webkitBackgroundClip = 'text';
          box.style.backgroundClip = 'text';
          box.style.webkitTextFillColor = 'transparent';
        }else if(deco === 'pop'){
          box.style.webkitTextStroke = `1.3px ${isLightColor_(color) ? '#1a1420' : '#f5ece0'}`;
          const d = Math.max(2, Math.round(size / 9));
          box.style.textShadow = `${d}px ${d}px 0 rgba(0,0,0,0.5)`;
        }
      }
      el.querySelectorAll('.size-row .text-opt, .color-opt, .shape-row .text-opt, .deco-row .text-opt, .pos-row .text-opt, .font-row .text-opt').forEach(opt => {
        opt.addEventListener('click', () => setTimeout(updatePreview, 0)); // 選択反映(selected付与)の直後に更新する
      });
      updatePreview();

      // 文字の大きさ・色・背景色・形・装飾効果・フォント・位置、それぞれタップで選択できるようにする(同じ行の中は1つだけ選ばれる)
      el.querySelectorAll('.size-row .text-opt').forEach(opt => {
        opt.addEventListener('click', () => {
          el.querySelectorAll('.size-row .text-opt').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
        });
      });
      el.querySelectorAll('.color-row .color-opt').forEach(opt => {
        opt.addEventListener('click', () => {
          el.querySelectorAll('.color-row .color-opt').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
        });
      });
      el.querySelectorAll('.bg-row .color-opt').forEach(opt => {
        opt.addEventListener('click', () => {
          el.querySelectorAll('.bg-row .color-opt').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
        });
      });
      el.querySelectorAll('.shape-row .text-opt').forEach(opt => {
        opt.addEventListener('click', () => {
          el.querySelectorAll('.shape-row .text-opt').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
        });
      });
      el.querySelectorAll('.deco-row .text-opt').forEach(opt => {
        opt.addEventListener('click', () => {
          el.querySelectorAll('.deco-row .text-opt').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
        });
      });
      el.querySelectorAll('.font-row .text-opt').forEach(opt => {
        opt.addEventListener('click', () => {
          el.querySelectorAll('.font-row .text-opt').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
        });
      });
      el.querySelectorAll('.pos-row .text-opt').forEach(opt => {
        opt.addEventListener('click', () => {
          el.querySelectorAll('.pos-row .text-opt').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
        });
      });

      el.querySelector('.approve-btn').addEventListener('click', async (e) => {
        const btn = e.target;
        btn.disabled = true;
        btn.textContent = '送信中…';

        const selectedSize = el.querySelector('.size-row .text-opt.selected').dataset.size;
        const selectedColor = el.querySelector('.color-row .color-opt.selected').dataset.color;
        const selectedBg = el.querySelector('.bg-row .color-opt.selected').dataset.bg;
        const shapeEl = el.querySelector('.shape-row .text-opt.selected');
        const selectedShape = shapeEl ? shapeEl.dataset.shape : 'glow';
        const selectedDeco = el.querySelector('.deco-row .text-opt.selected').dataset.deco;
        const selectedFont = el.querySelector('.font-row .text-opt.selected').dataset.font;
        const selectedPos = el.querySelector('.pos-row .text-opt.selected').dataset.pos;
        const style = {
          size: parseInt(selectedSize, 10),
          color: 'custom',
          colorCustom: selectedColor,
          shape: selectedShape,
          pos: selectedPos,
          deco: selectedDeco,
          font: selectedFont,
          bg: 'custom',
          bgCustom: selectedBg
        };

        try{
          await fetch(SUBMIT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              action: 'remoteApprovePhoto',
              photoKey: key,
              photoUrl: item.photoUrl || '',
              caption: item.message || '',
              style: style
            })
          });
          btn.textContent = '✅ 追加を依頼しました';
          btn.classList.add('done');
          setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 500); // 少し見せてから、すぐ一覧から消す
        }catch(err){
          btn.disabled = false;
          btn.textContent = '送信に失敗しました。もう一度押してください';
        }
      });

      itemList.appendChild(el);
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('refresh-btn').addEventListener('click', loadPending);
  loadPending();
  setInterval(loadPending, 8000); // 8秒おきに、一覧全体を更新

  // それとは別に、「承認状況」だけを、より軽く・素早く確認する(2.5秒ごと)
  // (PC・遠隔、どちらで承認されても、素早くお互いに反映されるようにするため)
  const fastSeenApprovals = new Set();
  setInterval(async () => {
    try{
      const res = await fetch(APPROVALS_URL, { cache: 'no-store' });
      if(!res.ok) return;
      const approvals = await res.json();
      approvals.forEach(a => {
        if(!a.photoKey || fastSeenApprovals.has(a.photoKey)) return;
        fastSeenApprovals.add(a.photoKey);
        const itemEl = document.querySelector(`.item[data-key="${CSS.escape(a.photoKey)}"]`);
        if(itemEl){
          itemEl.style.opacity = '0';
          setTimeout(() => {
            itemEl.remove();
            if(itemList.children.length === 0){
              itemList.innerHTML = '<div class="empty">承認待ちの投稿はありません</div>';
            }
          }, 300);
        }
      });
    }catch(err){ /* 次回のチェックで再挑戦する */ }
  }, 2500);
</script>

</body>
</html>
